<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <style>
      :focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 2px;
      }
      .error {
        color: #b91c1c;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Principal"><a href="/">Inicio</a></nav>
    </header>
    <main>
      <h1>Contacto</h1>
      <form novalidate>
        <div>
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required aria-invalid="false" />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-invalid="false"
            aria-describedby="email-ayuda"
          />
          <p id="email-ayuda" class="error" hidden>Introduce un email válido, por ejemplo nombre@correo.com</p>
        </div>

        <div>
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </main>
  </body>
</html>
