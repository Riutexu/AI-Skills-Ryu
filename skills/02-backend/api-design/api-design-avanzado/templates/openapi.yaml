openapi: 3.1.0
info:
  title: API de Comercio
  version: 1.0.0
  description: |
    Contrato de ejemplo para los recursos usuario y pedido. Incluye
    paginación cursor, filtros, errores RFC 7807 y seguridad Bearer.
servers:
  - url: https://api.midominio.com/api/v1
    description: Producción

security:
  - bearerAuth: []

tags:
  - name: Usuarios
  - name: Pedidos

paths:
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista usuarios con paginación cursor y filtros
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
        - $ref: '#/components/parameters/EstadoFiltro'
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaUsuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Usuarios]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuario'
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/usuarios/7f9c...ab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Problema'
        '409':
          $ref: '#/components/responses/Problema'

  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdUsuario'
    get:
      tags: [Usuarios]
      summary: Obtiene un usuario
      responses:
        '200':
          description: Usuario solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/Problema'
    patch:
      tags: [Usuarios]
      summary: Actualiza campos parciales de un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuario'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/Problema'
        '422':
          $ref: '#/components/responses/Problema'
    delete:
      tags: [Usuarios]
      summary: Elimina un usuario
      responses:
        '204':
          description: Usuario eliminado sin cuerpo de respuesta
        '404':
          $ref: '#/components/responses/Problema'

  /pedidos:
    get:
      tags: [Pedidos]
      summary: Lista pedidos filtrables por estado y usuario
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
        - name: usuarioId
          in: query
          description: Filtra pedidos de un usuario
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPedido'
    post:
      tags: [Pedidos]
      summary: Crea un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedido'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          $ref: '#/components/responses/Problema'
        '422':
          $ref: '#/components/responses/Problema'

  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPedido'
    get:
      tags: [Pedidos]
      summary: Obtiene un pedido
      responses:
        '200':
          description: Pedido solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          $ref: '#/components/responses/Problema'
    patch:
      tags: [Pedidos]
      summary: Actualiza el estado de un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoPedido'
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '409':
          $ref: '#/components/responses/Problema'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Identificador opaco de la última posición de la página anterior
      schema:
        type: string
        example: b3B0aW1pc3RhZG8
    Limite:
      name: limit
      in: query
      description: Tamaño de página entre 1 y 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    EstadoFiltro:
      name: estado
      in: query
      description: Filtra por estado del usuario
      schema:
        type: string
        enum: [activo, inactivo, pendiente]
    IdUsuario:
      name: id
      in: path
      required: true
      description: Identificador UUID del usuario
      schema:
        type: string
        format: uuid
    IdPedido:
      name: id
      in: path
      required: true
      description: Identificador UUID del pedido
      schema:
        type: string
        format: uuid

  schemas:
    Usuario:
      type: object
      required: [id, email, nombre]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        estado:
          type: string
          enum: [activo, inactivo, pendiente]
        fechaCreacion:
          type: string
          format: date-time
    CrearUsuario:
      type: object
      required: [email, nombre]
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          minLength: 2
    ActualizarUsuario:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
        estado:
          type: string
          enum: [activo, inactivo, pendiente]
    ListaUsuario:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        nextCursor:
          type: string
          nullable: true
    Pedido:
      type: object
      required: [id, usuarioId, estado, total]
      properties:
        id:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        estado:
          type: string
          enum: [pendiente, pagado, enviado, cancelado]
        total:
          type: number
          format: float
          minimum: 0
        fechaCreacion:
          type: string
          format: date-time
    CrearPedido:
      type: object
      required: [usuarioId, items]
      properties:
        usuarioId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedido'
    ActualizarEstadoPedido:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendiente, pagado, enviado, cancelado]
    ItemPedido:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1
    ListaPedido:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        nextCursor:
          type: string
          nullable: true
    Problema:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URL del tipo de problema (RFC 7807)
        title:
          type: string
          description: Título legible corto del problema
        status:
          type: integer
          description: Código HTTP del problema
        detail:
          type: string
          description: Explicación concreta para este caso
        instance:
          type: string
          format: uri
          description: Ruta que generó el problema
        errors:
          type: array
          description: Detalles de validación (miembro de dominio)
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo:
                type: string
              mensaje:
                type: string

  responses:
    Problema:
      description: Problema estándar RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos a esperar antes de reintentar (en 429)
    NoAutenticado:
      description: Autenticación requerida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: https://api.midominio.com/errores/no-autenticado
            title: No autenticado
            status: 401
            detail: Se requiere un token Bearer válido
            instance: /api/v1/usuarios