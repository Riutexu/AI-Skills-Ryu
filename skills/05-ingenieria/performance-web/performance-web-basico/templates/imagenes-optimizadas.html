<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tienda</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.miweb.com" />
    <style>
      img {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <img
      src="https://cdn.miweb.com/img/hero.webp"
      alt="Hero de la tienda"
      width="1200"
      height="750"
      fetchpriority="high"
      decoding="async"
    />

    <img
      src="https://cdn.miweb.com/img/producto-1.webp"
      alt="Producto 1"
      width="600"
      height="375"
      loading="lazy"
      decoding="async"
    />

    <script src="/app.js" defer></script>
  </body>
</html>
