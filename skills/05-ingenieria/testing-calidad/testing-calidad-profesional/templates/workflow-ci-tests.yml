name: Calidad de Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unitarios:
    name: Unitarios + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Tests unitarios con presupuesto de cobertura
        run: npx vitest run --coverage
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  mutation:
    name: Mutation testing (Stryker)
    runs-on: ubuntu-latest
    needs: [unitarios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Ejecutar mutantes sobre src/domain
        run: npx stryker run --mutate "src/domain/**/*.ts"
      - name: Subir reporte de mutacion
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: error

  e2e:
    name: E2E (Playwright ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: [unitarios]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E por shard
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          BASE_URL: ${{ vars.BASE_URL_E2E }}
      - name: Guardar evidencia en fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7